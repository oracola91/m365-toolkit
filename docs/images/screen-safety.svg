<svg xmlns="http://www.w3.org/2000/svg" width="919" height="898" viewBox="0 0 919 898" role="img" aria-label="Invoke-M365Toolkit.ps1  -  typed confirmation before a destructive change">
<title>Invoke-M365Toolkit.ps1  -  typed confirmation before a destructive change</title>
<rect x="0.5" y="0.5" width="918" height="897" rx="10" fill="#0d1117" stroke="#30363d"/>
<path d="M0.5 34 V10.5 a10 10 0 0 1 10 -10 H908.5 a10 10 0 0 1 10 10 V34 Z" fill="#161b22" stroke="#30363d"/>
<circle cx="20" cy="17.5" r="6" fill="#ff5f57"/>
<circle cx="40" cy="17.5" r="6" fill="#febc2e"/>
<circle cx="60" cy="17.5" r="6" fill="#28c840"/>
<text x="459.5" y="22.0" text-anchor="middle" font-family="-apple-system,Segoe UI,Helvetica,Arial,sans-serif" font-size="12.5" fill="#8b949e">Invoke-M365Toolkit.ps1  -  typed confirmation before a destructive change</text>
<g font-family="JetBrains Mono,Cascadia Mono,SFMono-Regular,Menlo,Consolas,DejaVu Sans Mono,Liberation Mono,monospace" font-size="13" xml:space="preserve">
<text x="18" y="62"><tspan fill="#f0f6fc">Building: Remove-MailboxPermission</tspan></text>
<text x="18" y="81"><tspan fill="#f0f6fc">  Take away access that was previously granted.</tspan></text>
<text x="18" y="100"><tspan fill="#f0f6fc">  1 required, 3 optional, 1 switches</tspan></text>
<text x="18" y="119"><tspan fill="#f0f6fc">  -&gt; The mailbox that WAS being accessed</tspan></text>
<text x="18" y="138"><tspan fill="#c9d1d9">Enter -Identity [text (e.g. an email address or name)] (required) - or type &#x27;find&#x27; to search - or &#x27;back&#x27; (previo</tspan></text>
<text x="18" y="157"><tspan fill="#c9d1d9">us field) / &#x27;cancel&#x27; (menu): </tspan><tspan fill="#56d4dd">support@contoso.com</tspan></text>
<text x="18" y="176"><tspan fill="#f0f6fc">  -&gt; The person who will LOSE the access</tspan></text>
<text x="18" y="195"><tspan fill="#c9d1d9">Enter -User [text (e.g. an email address or name)] - or type &#x27;find&#x27; to search - or &#x27;back&#x27; (previous field) / &#x27;ca</tspan></text>
<text x="18" y="214"><tspan fill="#c9d1d9">ncel&#x27; (menu): </tspan><tspan fill="#56d4dd">jordan@contoso.com</tspan></text>
<text x="18" y="233"><tspan fill="#f0f6fc">  -&gt; Which right to remove (usually FullAccess)</tspan></text>
<text x="18" y="271"><tspan fill="#f0f6fc">Choose one or more for -AccessRights:</tspan></text>
<text x="18" y="290"><tspan fill="#c9d1d9">   1. FullAccess</tspan></text>
<text x="18" y="309"><tspan fill="#c9d1d9">   2. ExternalAccount</tspan></text>
<text x="18" y="328"><tspan fill="#c9d1d9">   3. DeleteItem</tspan></text>
<text x="18" y="347"><tspan fill="#c9d1d9">   4. ReadPermission</tspan></text>
<text x="18" y="366"><tspan fill="#c9d1d9">   5. ChangePermission</tspan></text>
<text x="18" y="385"><tspan fill="#c9d1d9">   6. ChangeOwner</tspan></text>
<text x="18" y="404"><tspan fill="#f0f6fc">   0. Back to previous field   (or type &#x27;cancel&#x27; to quit to the menu)</tspan></text>
<text x="18" y="423"><tspan fill="#c9d1d9">Enter numbers (e.g. 1,3), 0 to go back, or ? to explain: </tspan><tspan fill="#56d4dd">1</tspan></text>
<text x="18" y="442"><tspan fill="#f0f6fc">  -&gt; FullAccess</tspan></text>
<text x="18" y="480"><tspan fill="#f0f6fc">Optional parameters you can set:</tspan></text>
<text x="18" y="499"><tspan fill="#c9d1d9">   1. InheritanceType  (String)</tspan></text>
<text x="18" y="518"><tspan fill="#f0f6fc">   (type ? to explain each one)</tspan></text>
<text x="18" y="537"><tspan fill="#c9d1d9">Enter numbers to set (comma-separated), ? to explain, or Enter to skip: </tspan></text>
<text x="18" y="575"><tspan fill="#f0f6fc">Switches you can enable:</tspan></text>
<text x="18" y="594"><tspan fill="#c9d1d9">   1. Deny</tspan></text>
<text x="18" y="613"><tspan fill="#f0f6fc">   (type ? to explain each one)</tspan></text>
<text x="18" y="632"><tspan fill="#c9d1d9">Enter numbers to enable (comma-separated), ? to explain, or Enter to skip: </tspan></text>
<text x="18" y="670"><tspan fill="#e3b341">Preview (dry-run):</tspan></text>
<text x="18" y="689"><tspan fill="#c9d1d9">  </tspan><tspan fill="#56d4dd">Remove-MailboxPermission</tspan><tspan fill="#e3b341"> -Identity</tspan><tspan fill="#f0f6fc"> &#x27;support@contoso.com&#x27;</tspan><tspan fill="#e3b341"> -User</tspan><tspan fill="#f0f6fc"> &#x27;jordan@contoso.com&#x27;</tspan><tspan fill="#e3b341"> -AccessRights</tspan><tspan fill="#f0f6fc"> &#x27;FullAccess&#x27;</tspan></text>
<text x="18" y="746"><tspan fill="#e3b341">FINAL CONFIRMATION - about to execute this command:</tspan></text>
<text x="18" y="765"><tspan fill="#c9d1d9">  </tspan><tspan fill="#56d4dd">Remove-MailboxPermission</tspan><tspan fill="#e3b341"> -Identity</tspan><tspan fill="#f0f6fc"> &#x27;support@contoso.com&#x27;</tspan><tspan fill="#e3b341"> -User</tspan><tspan fill="#f0f6fc"> &#x27;jordan@contoso.com&#x27;</tspan><tspan fill="#e3b341"> -AccessRights</tspan><tspan fill="#f0f6fc"> &#x27;FullAccess&#x27;</tspan></text>
<text x="18" y="803"><tspan fill="#f0f6fc">  (the cmdlet&#x27;s own confirmation is skipped - your answer here counts)</tspan></text>
<text x="18" y="841"><tspan fill="#ff7b72">[!] Remove-MailboxPermission: Remove is destructive and has no automatic undo.</tspan></text>
<text x="18" y="860"><tspan fill="#c9d1d9">To proceed, type exactly: Remove-MailboxPermission  (anything else cancels): </tspan><tspan fill="#56d4dd">y</tspan></text>
<text x="18" y="879"><tspan fill="#f0f6fc">Cancelled - nothing was run.</tspan></text>
</g></svg>
