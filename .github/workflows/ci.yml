name: CI

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

jobs:
  lint:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1  # v7.0.1
        with:
          persist-credentials: false
      - name: PSScriptAnalyzer (errors fail the build)
        shell: pwsh
        run: |
          Install-Module PSScriptAnalyzer -RequiredVersion 1.24.0 -Repository PSGallery -Scope CurrentUser -Force
          # Write-Host is the point of an interactive console tool, so that rule is left out.
          $r = Invoke-ScriptAnalyzer -Path ./Invoke-M365Toolkit.ps1 -ExcludeRule PSAvoidUsingWriteHost
          $r | Sort-Object Severity, Line | Format-Table -AutoSize Severity, Line, RuleName, Message | Out-String -Width 220 | Write-Host
          if (@($r | Where-Object Severity -eq 'Error').Count -gt 0) { throw 'PSScriptAnalyzer found errors.' }
      - name: PowerShell Gallery metadata
        shell: pwsh
        run: |
          $ErrorActionPreference = 'Stop'
          # The same check Publish-Script runs before an upload (PowerShellGet).
          $info = Test-ScriptFileInfo -Path ./Invoke-M365Toolkit.ps1
          $info | Format-List Name, Version, Guid, Author, Tags, ProjectUri, LicenseUri | Out-String -Width 220 | Write-Host
          # PSResourceGet (Install-PSResource) reads the same block with its own parser.
          if (Get-Command Test-PSScriptFileInfo -ErrorAction SilentlyContinue) {
            if (-not (Test-PSScriptFileInfo -Path ./Invoke-M365Toolkit.ps1)) { throw 'Test-PSScriptFileInfo failed.' }
          }
          # The help text must still be found after the PSScriptInfo block.
          $help = Get-Help ./Invoke-M365Toolkit.ps1
          if (-not $help.Synopsis -or -not $help.Description) { throw 'Comment-based help not found.' }
          # The Gallery version must match the version the tool prints in its banner.
          $m = Select-String -Path ./Invoke-M365Toolkit.ps1 -Pattern '^\$script:ToolkitVersion = ''v([0-9.]+)''' | Select-Object -First 1
          if (-not $m) { throw 'ToolkitVersion line not found.' }
          $norm = { param([version]$v) '{0}.{1}.{2}' -f $v.Major, $v.Minor, [math]::Max($v.Build, 0) }
          $tool = & $norm $m.Matches[0].Groups[1].Value
          $gallery = & $norm $info.Version
          if ($tool -ne $gallery) { throw "Version mismatch: PSScriptInfo $gallery, ToolkitVersion $tool." }
          Write-Host "Gallery version $gallery matches ToolkitVersion."

  test:
    strategy:
      fail-fast: false
      matrix:
        include:
          - { os: ubuntu-latest,  shell: pwsh }
          - { os: windows-latest, shell: pwsh }
          - { os: windows-latest, shell: powershell }
    name: test (${{ matrix.shell }}, ${{ matrix.os }})
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1  # v7.0.1
        with:
          persist-credentials: false
      # The step shell can't come from the matrix, so one step per shell.
      - name: Pester on PowerShell 7
        if: matrix.shell == 'pwsh'
        shell: pwsh
        run: |
          Install-Module Pester -RequiredVersion 5.7.1 -Repository PSGallery -Scope CurrentUser -Force -SkipPublisherCheck
          Import-Module Pester -RequiredVersion 5.7.1
          $r = Invoke-Pester ./tests -Output Detailed -PassThru
          if ($r.FailedCount -gt 0 -or $r.Result -ne 'Passed') { exit 1 }
      - name: Pester on Windows PowerShell 5.1
        if: matrix.shell == 'powershell'
        shell: powershell
        run: |
          Install-Module Pester -RequiredVersion 5.7.1 -Repository PSGallery -Scope CurrentUser -Force -SkipPublisherCheck
          Import-Module Pester -RequiredVersion 5.7.1
          $r = Invoke-Pester ./tests -Output Detailed -PassThru
          if ($r.FailedCount -gt 0 -or $r.Result -ne 'Passed') { exit 1 }
